<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="content-type" content="text/html; charset=UTF-8">
        <title>Beranda</title>
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>
    <body>
        <h1 style="font-size: 24px; color:blue;" >Selamat Datang Di Beranda</h1>
        <a href="about.html">Tentang Kami</a>
         <table id="tabelBukuTamu" border="1">
                <tr>
                    <th>Nama</th>
                    <th>Email</th>
                    <th>Pesan</th>
                </tr>
        </table>
        <script type="text/javascript">
            function bukutamu()
            {
               var nama;
               nama = prompt("Masukan nama anda");
               var email;
               email = prompt("masukan email anda");
               var pesan;
               pesan = prompt("tuliskan pesan anda");

               var table = document.getElementById("tabelBukuTamu");
               var newRow = table.insertRow();
 
            var cell1 = newRow.insertCell(0);
            var cell2 = newRow.insertCell(1);
            var cell3 = newRow.insertCell(2);
 
            cell1.textContent = nama;
            cell2.textContent = email;
            cell3.textContent = pesan;
        
            }
        </script>
       
        <button onclick="bukutamu()">Buku Tamu</button>

    </body>
</html>
